name: CI

# Checks main and the merge result of every pull request. "Commits" checks each commit of a pull request on its own.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: requirements_test.txt
          cache-python: true

      - name: Set up Python and the tools
        run: scripts/setup

      - name: Lint (ruff)
        run: .venv/bin/python -m ruff check --output-format github .

      - name: Check formatting (ruff format)
        run: .venv/bin/python -m ruff format --check .

      - name: Check types (mypy)
        run: .venv/bin/python -m mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: requirements_test.txt
          cache-python: true

      - name: Set up Python and the tools
        run: scripts/setup

      - name: Test (pytest)
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing:skip-covered

      - name: Test the release checks and the Release workflow (release-test.sh)
        run: .github/scripts/release-test.sh

  # The ruleset on main requires this check by its name: rename it only together with the ruleset (decision 27).
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Home Assistant's own environment, .dev/venv, comes from requirements_dev.txt, so its downloads are cached too.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: |
            requirements_test.txt
            requirements_dev.txt
          cache-python: true

      - name: Set up Python and the tools
        run: scripts/setup

      - name: Home Assistant, its template lights and a simulated wall switch (scripts/e2e)
        run: scripts/e2e

      - name: Keep Home Assistant's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-logs
          path: |
            .dev/e2e/*.log
            .dev/e2e/config/home-assistant.log*
          if-no-files-found: ignore
          # .dev is a hidden folder, which the action leaves out unless told.
          include-hidden-files: true
